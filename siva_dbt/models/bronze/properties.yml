models:
  - name: bronze_sales
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null
      - name: store_sk
        data_tests:
          - relationships:
              arguments:
                to: ref('bronze_store')
                field: store_sk
      - name: gross_amount
        data_tests:
          - generic_non_negative
             

  - name: bronze_store
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null
      - name: store_name
        tests:
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan','MegaMart Brooklyn','MegaMart Austin','MegaMart San Jose','MegaMart Toronto']
              config:
                severity: warn

